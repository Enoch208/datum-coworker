services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: datum
      POSTGRES_PASSWORD: datum
      POSTGRES_DB: datum
    ports:
      - "54330:5432"
    volumes:
      - datum-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datum -d datum"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  datum-postgres:
